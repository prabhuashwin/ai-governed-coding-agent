name: evals (real model)
# Manual: Actions → "evals (real model)" → Run workflow. Needs repository secret ANTHROPIC_API_KEY or OPENAI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "anthropic | openai"
        default: "anthropic"
        type: choice
        options: [anthropic, openai]
      model:
        description: "model name (blank = provider default)"
        default: ""
      repeats:
        description: "runs per task (variance)"
        default: "1"
      only:
        description: "substring filter on task name (blank = all)"
        default: ""
      max_cost_per_task:
        description: "hard USD cap per task (the harness stops the job at this spend)"
        default: "0.25"
jobs:
  evals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q -e . pytest
      - name: Write gca.toml
        run: |
          if [ "${{ inputs.provider }}" = "openai" ]; then
            MODEL="${{ inputs.model }}"; MODEL="${MODEL:-gpt-4.1}"
            printf '[provider]\nkind = "openai_compatible"\nmodel = "%s"\napi_key_env = "OPENAI_API_KEY"\nmax_tokens = 4096\n' "$MODEL" > gca.toml
          else
            MODEL="${{ inputs.model }}"; MODEL="${MODEL:-claude-sonnet-4-5}"
            printf '[provider]\nkind = "anthropic"\nmodel = "%s"\napi_key_env = "ANTHROPIC_API_KEY"\nmax_tokens = 4096\n' "$MODEL" > gca.toml
          fi
          cat >> gca.toml <<'TOML'
          [pricing]
          input_per_million = { "claude-sonnet-4-5" = 3.0, "claude-haiku-4-5" = 1.0, "claude-opus-4" = 15.0, "gpt-4.1" = 2.0, "gpt-4.1-mini" = 0.4, "gpt-5" = 1.25 }
          output_per_million = { "claude-sonnet-4-5" = 15.0, "claude-haiku-4-5" = 5.0, "claude-opus-4" = 75.0, "gpt-4.1" = 8.0, "gpt-4.1-mini" = 1.6, "gpt-5" = 10.0 }
          TOML
          cat gca.toml
      - name: Check the key is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.provider }}" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then echo "::error::OPENAI_API_KEY secret is not set"; exit 1; fi
          if [ "${{ inputs.provider }}" = "anthropic" ] && [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; fi
      - name: Apply the per-task cost cap
        run: |
          python - <<'PY'
          import json, pathlib
          cap = float("${{ inputs.max_cost_per_task }}")
          for t in pathlib.Path("evals/tasks").glob("*/task.json"):
              d = json.loads(t.read_text()); d.setdefault("budget", {})
              d["budget"]["max_cost_usd"] = min(cap, d["budget"].get("max_cost_usd", cap))
              t.write_text(json.dumps(d, indent=2))
              print(t.parent.name, "max_cost_usd =", d["budget"]["max_cost_usd"])
          PY
      - name: Run golden-task evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ONLY="${{ inputs.only }}"
          gca -c gca.toml eval --repeats "${{ inputs.repeats }}" ${ONLY:+--only "$ONLY"} | tee eval.log
          echo "## Eval results (${{ inputs.provider }})" >> "$GITHUB_STEP_SUMMARY"
          cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish results to the eval-results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/actions-publish-results.sh "real-${{ inputs.provider }}-${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ inputs.provider }}-${{ github.run_number }}
          path: |
            evals/results/
            eval.log
